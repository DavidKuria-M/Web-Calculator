<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="script.js"></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <header class="calc-header">
           <div class="title">
                <img src="./resources/calculator.png" alt="Calculator icon" class="icon">
                <span>Calculator</span>
           </div>
           <button id="theme-toggle">
                <img id="theme-icon" src="./resources/theme.png" alt="Theme btn">
           </button>
        </header>

        <div class="calc-display">
            <div class="previous-operand">0</div>
            <div class="current-operand">0</div>
        </div>

        <div class="calc-grid">
            <button class="btn btn-gray">C</button>
            <button class="btn btn-gray">(</button>
            <button class="btn btn-gray">)</button>
            <button class="btn btn-blue" aria-label="Divide">&divide;</button>

            <button class="btn btn-gray">7</button>
            <button class="btn btn-gray">8</button>
            <button class="btn btn-gray">9</button>
            <button class="btn btn-blue" aria-label="Multiply">&times;</button>

            <button class="btn btn-gray">4</button>
            <button class="btn btn-gray">5</button>
            <button class="btn btn-gray">6</button>
            <button class="btn btn-blue">-</button>

            <button class="btn btn-gray">1</button>
            <button class="btn btn-gray">2</button>
            <button class="btn btn-gray">3</button>
            <button class="btn btn-blue">+</button>

            <button class="btn btn-gray">0</button>
            <button class="btn btn-gray">%</button>
            <button class="btn btn-gray">.</button>
            <button class="btn btn-blue">=</button>

        </div>

    </div>
</body>
</html>
