<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
   <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <header class="calc-header">
           <div class="title">
                <img src="./resources/calculator.png" alt="Calculator icon" class="icon">
                <span>Calculator</span>
           </div>
           <button id="theme-toggle">
                <img id="theme-icon" src="./resources/theme.png" alt="Theme btn">
           </button>
        </header>

        <div class="calc-display" id="display">
            <div class="previous-operand" id="previous-operand">0</div>
            <div class="current-operand" id="current-operand">0</div>
        </div>

        <div class="calc-grid">
            <button class="btn btn-gray" id="clear">C</button>
            <button class="btn btn-gray" id="open-bracket">(</button>
            <button class="btn btn-gray" id="close-bracket">)</button>
            <button class="btn btn-blue" aria-label="divide" id="division">&divide;</button>

            <button class="btn btn-gray" id="seven">7</button>
            <button class="btn btn-gray" id="eight">8</button>
            <button class="btn btn-gray" id="nine">9</button>
            <button class="btn btn-blue" aria-label="Multiply" id="multiply">&times;</button>

            <button class="btn btn-gray" id="four">4</button>
            <button class="btn btn-gray" id="five">5</button>
            <button class="btn btn-gray" id="six">6</button>
            <button class="btn btn-blue" id="minus">-</button>

            <button class="btn btn-gray" id="one">1</button>
            <button class="btn btn-gray" id="two">2</button>
            <button class="btn btn-gray" id="three">3</button>
            <button class="btn btn-blue" id="plus">+</button>

            <button class="btn btn-gray" id="zero">0</button>
            <button class="btn btn-gray" id="percentage">%</button>
            <button class="btn btn-gray" id="decimal">.</button>
            <button class="btn btn-blue" id="equals">=</button>

        </div>

    </div>

    
</body>
</html>
